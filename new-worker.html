<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حسابك</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .nw-box{background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:460px;}
  .nw-box h1{color:#1e3c72;font-size:19px;text-align:center;margin-bottom:6px;}
  .nw-box .subtitle{color:#666;font-size:13px;text-align:center;line-height:1.7;margin-bottom:18px;}
  .info-box{background:#fff3e0;border-right:4px solid #ff9800;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#e65100;line-height:1.7;margin-bottom:18px;}
  .form-group{margin-bottom:13px;}
  .form-group label{display:block;margin-bottom:5px;color:#333;font-size:13px;font-weight:600;}
  .form-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:9px;font-size:14px;font-family:inherit;}
  .form-group input:focus{outline:none;border-color:#2a5298;}
  .btn-save{width:100%;padding:14px;background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;}
  .error-msg{color:#c62828;text-align:center;margin-top:10px;font-size:13px;font-weight:600;min-height:20px;}
</style>
</head>
<body>

<div class="nw-box">
  <h1>👤 إنشاء حسابك</h1>
  <p class="subtitle">تم تحميل بيانات المكتب من السحابة.<br>الآن أنشئ حسابك الخاص على هذا الجهاز.</p>

  <div class="info-box">
    ⚠️ <b>ملاحظة مهمة:</b><br>
    هذا جهاز ثانوي. سيتم إنشاؤك بصلاحية <b>"عامل"</b>.<br>
    المالك سيحدد صلاحياتك من جهازه.
  </div>

  <form id="newWorkerForm">
    <div class="form-group">
      <label>👤 اسم المستخدم</label>
      <input type="text" id="nwUsername" required minlength="3" autocomplete="off">
    </div>
    <div class="form-group">
      <label>🔒 كلمة المرور</label>
      <input type="password" id="nwPassword" required minlength="6" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>🔒 تأكيد كلمة المرور</label>
      <input type="password" id="nwPassword2" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="btn-save">✅ إنشاء حسابي والدخول</button>
    <div id="nwError" class="error-msg"></div>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/db.js"></script>
<script src="js/new-worker.js"></script>
</body>
</html>
