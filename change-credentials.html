<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغيير بيانات الدخول</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); align-items: flex-start; padding-top: 30px; }
  .chg-box { background: #fff; border-radius: 16px; padding: 30px 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 460px; }
  .chg-box h1 { color: #1e3c72; font-size: 20px; margin-bottom: 6px; text-align: center; }
  .chg-box .desc { color: #777; font-size: 13px; text-align: center; margin-bottom: 25px; line-height: 1.6; }
  .welcome-badge { background: #e3f2fd; color: #1565c0; text-align: center; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
</style>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3c72">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المحاسبة">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<div class="chg-box">
  <h1>🔐 تغيير بيانات الدخول</h1>
  <p class="desc">لأمان المكتب، يجب تغيير اسم المستخدم وكلمة المرور قبل البدء.</p>

  <div class="welcome-badge" id="welcomeBadge">مرحباً بك</div>

  <form id="changeForm">

    <div class="form-group">
      <label>اسم المستخدم الجديد <span style="color:#d32f2f">*</span></label>
      <input type="text" id="newUsername" required minlength="3" autocomplete="username">
    </div>

    <div class="form-group">
      <label>كلمة المرور الجديدة <span style="color:#d32f2f">*</span></label>
      <input type="password" id="newPassword" required minlength="4" autocomplete="new-password">
    </div>

    <div class="form-group">
      <label>تأكيد كلمة المرور <span style="color:#d32f2f">*</span></label>
      <input type="password" id="confirmPassword" required minlength="4" autocomplete="new-password">
    </div>

    <div id="changeError" class="error-msg"></div>

    <button type="submit" class="btn-primary" style="width:100%;margin-top:15px;">حفظ ومتابعة</button>
  </form>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/db.js"></script>
<script src="js/auto-backup.js"></script>
<script src="js/change-credentials.js"></script>

<div style="text-align:center;color:#aaa;font-size:11px;padding:15px 10px;line-height:1.7;margin-top:10px;">
  💻 برمجة وتطوير: <b style="color:#2a5298;">م/ ربيع الحريبي</b><br>📞 778983131<br>
  © 2026 — جميع الحقوق محفوظة
</div>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js?v=99').catch(err => {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>
<script src="js/branding.js"></script>
</body>
</html>
