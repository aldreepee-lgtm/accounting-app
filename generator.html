<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 مولّد الرموز - للمطور</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: linear-gradient(135deg, #4a148c, #6a1b9a); min-height: 100vh; padding: 20px; color: #333; }

  .container { max-width: 700px; margin: 0 auto; }

  .header { text-align: center; color: #fff; margin-bottom: 25px; }
  .header h1 { font-size: 24px; margin-bottom: 8px; }
  .header p { font-size: 13px; opacity: 0.85; }
  .header .dev-badge { display: inline-block; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px; margin-top: 10px; font-size: 12px; }

  .card { background: #fff; border-radius: 14px; padding: 25px 22px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; color: #333; }
  .form-group input { width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; font-family: inherit; text-align: center; }
  .form-group input:focus { outline: none; border-color: #6a1b9a; }

  .btn-generate { width: 100%; padding: 15px; background: linear-gradient(135deg, #6a1b9a, #4a148c); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .btn-generate:hover { opacity: 0.95; }

  .result-box { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; border-radius: 14px; padding: 25px 20px; text-align: center; margin-bottom: 15px; display: none; }
  .result-box.show { display: block; }
  .result-box .result-label { font-size: 13px; opacity: 0.9; margin-bottom: 10px; }
  .result-box .result-code { font-family: 'Courier New', monospace; font-size: 26px; font-weight: 900; letter-spacing: 3px; margin-bottom: 15px; }
  .result-box .result-office { font-size: 14px; opacity: 0.95; margin-bottom: 18px; }
  .result-box .btn-copy { background: rgba(255,255,255,0.25); color: #fff; border: 2px solid rgba(255,255,255,0.5); padding: 10px 24px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700; }
  .result-box .btn-copy:hover { background: rgba(255,255,255,0.35); }

  .history-title { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .history-title .btn-clear { background: #ffebee; color: #c62828; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; }

  .history-item { background: #f9f9f9; border-right: 4px solid #6a1b9a; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .history-item .h-name { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 4px; }
  .history-item .h-code { font-family: 'Courier New', monospace; font-size: 14px; font-weight: 700; color: #6a1b9a; letter-spacing: 1px; }
  .history-item .h-date { font-size: 10px; color: #999; }
  .history-item .h-copy { background: #e1bee7; color: #4a148c; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; }

  .empty-msg { text-align: center; color: #aaa; font-size: 13px; padding: 20px; }

  .info-box { background: rgba(255,255,255,0.15); color: #fff; padding: 14px 16px; border-radius: 10px; font-size: 12px; line-height: 1.7; text-align: center; }
</style>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3c72">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المحاسبة">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🔐 مولّد رموز الترخيص</h1>
    <p>أداة خاصة بالمطور لتوليد رموز تفعيل للمكاتب</p>
    <span class="dev-badge">💻 برمجة وتطوير: م/ ربيع الحريبي</span>
  </div>

  <div class="card">
    <div class="form-group">
      <label>اسم المكتب (كما سيدخله المشتري)</label>
      <input type="text" id="officeInput" placeholder="مثال: مكتب النور" autocomplete="off">
    </div>
    <button class="btn-generate" onclick="doGenerate()">🔑 توليد الرمز</button>
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-label">✅ رمز الترخيص</div>
    <div class="result-code" id="resultCode">---</div>
    <div class="result-office" id="resultOffice"></div>
    <button class="btn-copy" onclick="copyResult()">📋 نسخ الرمز</button>
  </div>

  <div class="card">
    <div class="history-title">
      📜 الرموز المولّدة سابقاً
      <button class="btn-clear" onclick="clearHistory()">🗑 مسح السجل</button>
    </div>
    <div id="historyList"></div>
  </div>

  <div class="info-box">
    ⚠️ <b>ملاحظة:</b> احفظ هذه الصفحة على جهازك فقط — لا تشاركها مع المشترين.<br>
    كل مكتب يحصل على رمز خاص به يعمل فقط مع اسمه.
  </div>

</div>

<script src="js/license.js"></script>
<script src="js/generator.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
