<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إيصال</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 60px 15px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* سهم الرجوع الأنيق */
  .back-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    z-index: 100;
  }
  .back-btn:hover { transform: scale(1.1); background: #f0f0f0; }
  .back-btn svg { width: 22px; height: 22px; stroke: #2a5298; stroke-width: 3; fill: none; }

  .page-title {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  /* صندوق الإيصال */
  .receipt-box {
    background: #fff;
    width: 100%;
    max-width: 400px;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.05);
  }
  .receipt-box .r-watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%) rotate(-22deg);
    max-width: 70%;
    max-height: 70%;
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
  }
  .receipt-box > *:not(.r-watermark) {
    position: relative;
    z-index: 1;
  }

  /* رأس الإيصال - نسخة مضغوطة */
  .r-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 2px dashed #d0d0d0;
  }
  .r-header .logo-wrap {
    flex-shrink: 0;
  }
  .r-header img {
    width: 55px;
    height: 55px;
    object-fit: contain;
    border-radius: 10px;
    background: #fff;
    padding: 3px;
    border: 2px solid #f0f0f0;
  }
  .r-header .placeholder {
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 55px;
    height: 55px;
    background: #f0f2f5;
    border-radius: 10px;
  }
  .r-header .header-info {
    flex: 1;
    text-align: right;
  }
  .r-header h1 {
    font-size: 16px;
    color: #1e3c72;
    font-weight: 800;
    margin-bottom: 3px;
    line-height: 1.3;
  }
  .r-header .contact {
    font-size: 10.5px;
    color: #666;
    line-height: 1.6;
  }

  /* معلومات الإيصال */
  .r-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    font-size: 11px;
    color: #444;
    margin-bottom: 14px;
    padding: 12px;
    background: #f8f9ff;
    border-radius: 10px;
    border: 1px solid #e6ebff;
  }
  .r-meta .cell {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .r-meta .cell .lbl {
    color: #888;
    font-size: 10px;
    font-weight: 500;
  }
  .r-meta .cell .val {
    color: #2a5298;
    font-weight: 700;
    font-size: 12px;
  }

  /* الجدول */
  .r-table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    border-radius: 10px;
    overflow: hidden;
  }
  .r-table th {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    padding: 10px 12px;
    font-size: 12px;
    text-align: right;
    font-weight: 700;
  }
  .r-table td {
    padding: 11px 12px;
    font-size: 13px;
    color: #333;
    border-bottom: 1px solid #eee;
  }
  .r-table tr:last-child td { border-bottom: none; }
  .r-table .desc { font-weight: 600; color: #333; }
  .r-table .amt { font-weight: 800; color: #2e7d32; text-align: left; }

  /* الإجمالي */
  .r-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    border-radius: 12px;
    margin-top: 6px;
    color: #fff;
    box-shadow: 0 6px 16px rgba(17,153,142,0.25);
  }
  .r-total span:first-child { font-size: 14px; font-weight: 600; opacity: 0.95; }
  .r-total span:last-child { font-size: 20px; font-weight: 800; }

  /* الفوتر */
  .r-footer {
    text-align: center;
    padding-top: 16px;
    margin-top: 16px;
    border-top: 2px dashed #d0d0d0;
    font-size: 11px;
    color: #888;
    line-height: 1.9;
  }
  .r-footer b { color: #2a5298; }
  .r-footer .thanks {
    display: inline-block;
    margin-top: 6px;
    color: #2e7d32;
    font-weight: 700;
    font-size: 12px;
  }

  /* الأزرار */
  .actions {
    width: 100%;
    max-width: 400px;
    margin-top: 25px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .actions button {
    padding: 14px 10px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #fff;
  }
  .actions button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
  .actions button:active { transform: translateY(0); }
  .actions .full { grid-column: 1 / -1; }
  .btn-thermal { background: linear-gradient(135deg, #1e3c72, #2a5298); }
  .btn-a4 { background: linear-gradient(135deg, #673ab7, #512da8); }
  .btn-share { background: linear-gradient(135deg, #25d366, #128c7e); }

  /* وضع الطباعة */
  @media print {
    body { background: #fff; padding: 0; }
    .back-btn, .page-title, .actions { display: none !important; }
    .receipt-box { box-shadow: none; border-radius: 0; max-width: 100%; padding: 5mm; }
  }
  body.print-thermal .receipt-box { max-width: 80mm; }
  body.print-thermal .r-header h1 { font-size: 15px; }
  body.print-thermal .r-table th, body.print-thermal .r-table td { padding: 5px; font-size: 11px; }
</style>
</head>
<body>

<button class="back-btn" onclick="window.history.back()" title="رجوع">
  <svg viewBox="0 0 24 24">
    <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div class="page-title" id="pageTitle">🧾 إيصال</div>
<div id="rTypeBadge" style="text-align:center;background:linear-gradient(135deg,#2a5298,#1e3c72);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:800;margin:0 auto 12px;display:table;box-shadow:0 4px 12px rgba(42,82,152,0.3);">🧾 إيصال</div>

<div class="receipt-box" id="receiptBox">
  <img class="r-watermark" id="rWatermark" src="" alt="">

  <div class="r-header">
    <div class="logo-wrap" id="rLogoWrap"><div class="placeholder">📚</div></div>
    <div class="header-info">
      <h1 id="rOfficeName">اسم المكتب</h1>
    </div>
    <div class="office-header-left" id="rContact"></div>
  </div>

  <div id="rStats" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;width:100%;box-sizing:border-box;"></div>

  <table class="r-table">
    <thead>
      <tr>
        <th>الوصف</th>
        <th style="text-align:left;">المبلغ</th>
      </tr>
    </thead>
    <tbody id="rBody"></tbody>
  </table>

  <div class="r-total">
    <span>💰 الإجمالي</span>
    <span id="rTotal">0</span>
  </div>

  <div class="r-footer">
    💻 برمجة وتطوير: <b>م/ ربيع الحريبي</b><br>
    📞 778983131
    <br>
    <span class="thanks">✨ شكراً لتعاملكم معنا ✨</span>
  </div>
</div>

<div class="actions">
  <button class="btn-thermal" onclick="printThermal()">🖨️ طباعة حرارية</button>
  <button class="btn-a4" onclick="printA4()">📄 طباعة A4</button>
  <button class="btn-share full" onclick="shareAsImage()">📤 مشاركة كصورة</button>
</div>

<script src="js/db.js"></script>
<script src="js/receipt.js"></script>
</body>
</html>
